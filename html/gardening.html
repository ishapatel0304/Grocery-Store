<!DOCTYPE html>

<html>

    <title>

        Gardening Products

    </title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">


    <link rel="stylesheet" type="text/css" href="../css/gardening.css">

    <body>

        <section id="popular-product">
            <!--heading----------->
            <div class="product-heading">
                <h2 class = 'fruits-heading'>Gardening Products</h2>
            </div>
            <!--box-container------>
            <div class="product-container">
                <!--box---------->
                <div class="product-box" style = "height: 95%;">
                    <img alt="Gardening Gloves" src="../images/Gloves.jpg">
                    <strong>Gardening Gloves</strong>
                    <span class="quantity">1</span>
                    <span class="price">Rs. 160</span>
                    <!--cart-btn------->
                    <button class="cart-btn add-to-cart" 
                            data-id="26" 
                            data-name="Gardening Gloves" 
                            data-price="160"
                            data-image="../images/Gloves.jpg">
                            <i class="fas fa-shopping-bag"></i> Add to Cart
                        </button>
                    <!--like-btn------->
                    <button class="like-btn" 
                    data-id="26" 
                    data-name="Gardening Gloves" 
                    data-price="160"
                    data-image="../images/Gloves.jpg" style="border: none; background: transparent;">
                            <i class="far fa-heart"></i>
                        </button>
                </div>
                <!--box---------->
                <div class="product-box" style="height: 95%;">
                    <img alt="Watering Can" src="../images/Watering Can.jpg">
                    <strong>Watering Can</strong>
                    <span class="quantity">1</span>
                    <span class="price">Rs. 249</span>
                    <!--cart-btn------->
                    <button class="cart-btn add-to-cart" 
                            data-id="27" 
                            data-name="Watering Can" 
                            data-price="249"
                            data-image="../images/Watering Can.jpg">
                            <i class="fas fa-shopping-bag"></i> Add to Cart
                        </button>
                    <!--like-btn------->
                    <button class="like-btn" 
                    data-id="27" 
                            data-name="Watering Can" 
                            data-price="249"
                            data-image="../images/Watering Can.jpg" style="border: none; background: transparent;">
                            <i class="far fa-heart"></i>
                        </button>
                </div>
                <!--box---------->
                <div class="product-box" style="height: 95%;">
                    <img alt="Unigrow Manure" src="../images/Manure.jpeg">
                    <strong>Unigrow Manure</strong>
                    <span class="quantity">900 g</span>
                    <span class="price">Rs. 196</span>
                    <!--cart-btn------->
                    <button class="cart-btn add-to-cart" 
                            data-id="28" 
                            data-name="Unigrow Manure" 
                            data-price="196"
                            data-image="../images/Manure.jpeg">
                            <i class="fas fa-shopping-bag"></i> Add to Cart
                        </button>
                    <!--like-btn------->
                    <button class="like-btn" 
                    data-id="28" 
                    data-name="Unigrow Manure" 
                    data-price="196"
                    data-image="../images/Manure.jpeg" style="border: none; background: transparent;">
                     <i class="far fa-heart"></i>
                    </button>
                </div>
                <div class="back-home">
                    <a href="../html/home.html">Back to Home</a>
                </div>
            </div>
        </section>
        <script src="../js/cart.js"></script>
        <script src="../js/cart-display.js"></script>
        <script src="../js/wishlist.js"></script>
    </body>

</html>
